<!-- ============================================
     Private Journal — client-side encrypted (AES-GCM / PBKDF2)
     Habit tracker + pinned row + masonry timeline.
     Nothing here is readable without the passphrase.
     ============================================ -->

<section class="journal-page" id="journal-app"
         data-endpoint="{{ '/assets/journal/entries.json' | relative_url }}">
  <div class="container">

    <!-- Lock screen -->
    <div class="jr-gate" id="jr-gate">
      <div class="jr-lock-icon"><i class="fas fa-lock"></i></div>
      <h1 class="jr-gate-title" id="jr-gate-title" data-i18n="gateTitle"></h1>
      <p class="jr-gate-sub" id="jr-gate-sub" data-i18n="gateSub"></p>

      <form class="jr-gate-form" id="jr-gate-form" autocomplete="off">
        <input type="password" id="jr-pass" class="jr-input" autocomplete="current-password" data-i18n-ph="passPlaceholder">
        <input type="password" id="jr-pass2" class="jr-input jr-hidden" autocomplete="new-password" data-i18n-ph="passPlaceholder2">
        <button type="submit" class="btn btn--primary jr-gate-btn" id="jr-gate-btn"></button>
      </form>
      <p class="jr-msg" id="jr-gate-msg"></p>
    </div>

    <!-- Journal -->
    <div class="jr-main jr-hidden" id="jr-main">

      <header class="jr-head">
        <div>
          <h1 class="jr-title" data-i18n="title"></h1>
          <p class="jr-sub"><span id="jr-count"></span><span class="jr-dot">·</span><span data-i18n="privateNote"></span></p>
        </div>
        <div class="jr-actions">
          <button class="jr-btn jr-btn--accent" id="jr-new"><i class="fas fa-feather"></i> <span data-i18n="newEntry"></span></button>
          <button class="jr-btn" id="jr-save"><i class="fas fa-file-shield"></i> <span data-i18n="export"></span></button>
          <div class="jr-menu-wrap">
            <button class="jr-btn jr-btn--icon" id="jr-more" aria-label="More"><i class="fas fa-ellipsis"></i></button>
            <div class="jr-menu jr-hidden" id="jr-menu">
              <button class="jr-menu-item" id="jr-backup"><i class="fas fa-download"></i> <span data-i18n="backup"></span></button>
              <button class="jr-menu-item" id="jr-import"><i class="fas fa-file-import"></i> <span data-i18n="importBackup"></span></button>
              <button class="jr-menu-item" id="jr-chpass"><i class="fas fa-key"></i> <span data-i18n="changePass"></span></button>
              <button class="jr-menu-item" id="jr-lock"><i class="fas fa-lock"></i> <span data-i18n="lock"></span></button>
            </div>
          </div>
        </div>
      </header>

      <p class="jr-dirty jr-hidden" id="jr-dirty"><i class="fas fa-circle-exclamation"></i> <span data-i18n="unsaved"></span></p>

      <!-- ============ Habit tracker ============ -->
      <section class="jr-habits" id="jr-habits">
        <div class="jr-habits-head">
          <div class="jr-habits-title">
            <h2><i class="fas fa-seedling"></i> <span data-i18n="habitsTitle"></span></h2>
            <p class="jr-habits-sub" id="jr-habits-range"></p>
          </div>
          <div class="jr-habits-tools">
            <div class="jr-seg">
              <button class="jr-seg-btn active" data-view="week" data-i18n="viewWeek"></button>
              <button class="jr-seg-btn" data-view="month" data-i18n="viewMonth"></button>
            </div>
            <div class="jr-nav">
              <button class="jr-nav-btn" id="jr-prev" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
              <button class="jr-nav-btn" id="jr-today" data-i18n="today"></button>
              <button class="jr-nav-btn" id="jr-next" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
            </div>
            <button class="jr-btn jr-btn--sm" id="jr-habit-add"><i class="fas fa-plus"></i> <span data-i18n="addHabit"></span></button>
          </div>
        </div>

        <!-- stat strip -->
        <div class="jr-stats" id="jr-stats"></div>

        <!-- week table -->
        <div class="jr-table-wrap" id="jr-week-wrap">
          <table class="jr-table" id="jr-week-table"></table>
        </div>

        <!-- month view -->
        <div class="jr-month jr-hidden" id="jr-month"></div>

        <p class="jr-habits-empty jr-hidden" id="jr-habits-empty">
          <span data-i18n="noHabits"></span>
          <button class="jr-link-btn" id="jr-habit-seed" data-i18n="seedHabits"></button>
        </p>
      </section>

      <!-- Entry editor -->
      <div class="jr-editor jr-hidden" id="jr-editor">
        <div class="jr-editor-row">
          <label class="jr-field jr-field--date">
            <span data-i18n="fDate"></span>
            <input type="date" id="jr-f-date" class="jr-input">
          </label>
          <label class="jr-field jr-field--time">
            <span data-i18n="fTime"></span>
            <input type="time" id="jr-f-time" class="jr-input">
          </label>
          <label class="jr-field jr-field--mood">
            <span data-i18n="fMood"></span>
            <input type="text" id="jr-f-mood" class="jr-input" maxlength="12" placeholder="🙂">
          </label>
        </div>
        <label class="jr-field">
          <span data-i18n="fTitle"></span>
          <input type="text" id="jr-f-title" class="jr-input" data-i18n-ph="fTitlePh">
        </label>
        <label class="jr-field">
          <span data-i18n="fBody"></span>
          <textarea id="jr-f-body" class="jr-input jr-textarea" rows="12" data-i18n-ph="fBodyPh"></textarea>
        </label>
        <p class="jr-hint" data-i18n="editorHint"></p>
        <label class="jr-field">
          <span data-i18n="fTags"></span>
          <input type="text" id="jr-f-tags" class="jr-input" data-i18n-ph="fTagsPh">
        </label>
        <div class="jr-editor-foot">
          <label class="jr-check">
            <input type="checkbox" id="jr-f-pin">
            <span data-i18n="fPin"></span>
          </label>
          <div class="jr-editor-btns">
            <button class="jr-btn jr-btn--ghost" id="jr-cancel" data-i18n="cancel"></button>
            <button class="jr-btn jr-btn--danger jr-hidden" id="jr-delete" data-i18n="delete"></button>
            <button class="jr-btn jr-btn--accent" id="jr-commit" data-i18n="saveEntry"></button>
          </div>
        </div>
      </div>

      <!-- Pinned row -->
      <section class="jr-section jr-hidden" id="jr-pinned-wrap">
        <h2 class="jr-section-title"><i class="fas fa-thumbtack"></i> <span data-i18n="pinned"></span></h2>
        <div class="jr-pinned-row" id="jr-pinned"></div>
      </section>

      <!-- Search + tags -->
      <div class="jr-bar">
        <div class="jr-search">
          <i class="fas fa-magnifying-glass"></i>
          <input type="text" id="jr-q" data-i18n-ph="searchPlaceholder">
        </div>
        <div class="jr-tags" id="jr-tagbar"></div>
      </div>

      <!-- Masonry timeline -->
      <section class="jr-section">
        <div class="jr-grid" id="jr-timeline"></div>
      </section>

      <p class="jr-empty jr-hidden" id="jr-empty" data-i18n="emptyState"></p>
    </div>

  </div>
  <input type="file" id="jr-file" accept="application/json,.json" class="jr-hidden">
</section>

<style>
/* ---------- Journal ---------- */
.journal-page { padding-top: calc(var(--header-height) + var(--space-2xl)); padding-bottom: var(--space-3xl); }
.jr-hidden { display: none !important; }

/* Gate */
.jr-gate { max-width: 420px; margin: var(--space-2xl) auto; text-align: center; }
.jr-lock-icon {
  width: 64px; height: 64px; margin: 0 auto var(--space-lg);
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--color-accent-light);
  color: var(--color-accent); font-size: 1.4rem;
}
.jr-gate-title { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; margin-bottom: var(--space-sm); }
.jr-gate-sub { color: var(--color-text-light); font-size: 0.95rem; margin-bottom: var(--space-xl); }
.jr-gate-form { display: flex; flex-direction: column; gap: var(--space-md); }
.jr-gate-btn { justify-content: center; }
.jr-msg { margin-top: var(--space-md); font-size: 0.88rem; min-height: 1.3em; color: var(--color-accent); }

/* Inputs */
.jr-input {
  width: 100%; padding: 12px 16px; font-family: var(--font-sans); font-size: 0.95rem;
  color: var(--color-text); background: var(--color-surface);
  border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  transition: border-color var(--transition);
}
.jr-input:focus { outline: none; border-color: var(--color-accent); }
.jr-textarea { font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.75; resize: vertical; }

/* Head */
.jr-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-lg); flex-wrap: wrap; margin-bottom: var(--space-lg); }
.jr-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
.jr-sub { color: var(--color-text-muted); font-size: 0.85rem; }
.jr-dot { margin: 0 0.5em; }
.jr-actions { display: flex; align-items: center; gap: var(--space-sm); }

.jr-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 9px 16px; font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500;
  color: var(--color-text); background: var(--color-surface);
  border: 1.5px solid var(--color-border); border-radius: 50px;
  transition: all var(--transition); white-space: nowrap;
}
.jr-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
.jr-btn--accent { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.jr-btn--accent:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); color: #fff; }
.jr-btn--ghost { border-color: transparent; color: var(--color-text-light); background: transparent; }
.jr-btn--danger:hover { border-color: #C0503A; color: #C0503A; }
.jr-btn--icon { padding: 9px 13px; }
.jr-btn--sm { padding: 7px 14px; font-size: 0.8rem; }

.jr-menu-wrap { position: relative; }
.jr-menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; min-width: 200px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 6px;
}
.jr-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer;
  padding: 9px 12px; font-family: var(--font-sans); font-size: 0.85rem; text-align: left;
  color: var(--color-text); background: transparent; border: none; border-radius: var(--radius-sm);
}
.jr-menu-item:hover { background: var(--color-bg-alt); color: var(--color-accent); }

.jr-dirty { font-size: 0.82rem; color: var(--color-accent); margin-bottom: var(--space-md); }

/* ---------- Habit tracker ---------- */
.jr-habits {
  background: var(--color-surface); border: 1px solid var(--color-border-light);
  border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-lg) var(--space-md);
  box-shadow: var(--shadow-sm); margin-bottom: var(--space-2xl);
}
.jr-habits-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-lg); }
.jr-habits-title h2 { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.jr-habits-title h2 i { color: var(--color-accent); font-size: 0.95rem; }
.jr-habits-sub { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-text-muted); margin-top: 4px; letter-spacing: 0.02em; }
.jr-habits-tools { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }

.jr-seg { display: inline-flex; background: var(--color-bg-alt); border-radius: 50px; padding: 3px; }
.jr-seg-btn {
  cursor: pointer; border: none; background: transparent; border-radius: 50px;
  padding: 6px 16px; font-family: var(--font-sans); font-size: 0.8rem; font-weight: 500; color: var(--color-text-light);
  transition: all var(--transition);
}
.jr-seg-btn.active { background: var(--color-surface); color: var(--color-accent); box-shadow: var(--shadow-sm); }

.jr-nav { display: inline-flex; align-items: center; gap: 2px; }
.jr-nav-btn {
  cursor: pointer; background: transparent; border: 1.5px solid transparent; border-radius: 50px;
  padding: 6px 12px; font-family: var(--font-sans); font-size: 0.8rem; color: var(--color-text-light);
}
.jr-nav-btn:hover { border-color: var(--color-border); color: var(--color-accent); }

/* stat strip */
.jr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-lg); }
.jr-stat { background: var(--color-bg-alt); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); }
.jr-stat-label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 6px; }
.jr-stat-value { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; line-height: 1.1; color: var(--color-text); }
.jr-stat-value small { font-family: var(--font-sans); font-size: 0.8rem; font-weight: 400; color: var(--color-text-muted); margin-left: 4px; }
.jr-stat-bar { height: 4px; border-radius: 4px; background: var(--color-border-light); margin-top: 10px; overflow: hidden; }
.jr-stat-bar span { display: block; height: 100%; border-radius: 4px; background: var(--color-accent); transition: width var(--transition-slow); }

/* week table */
.jr-table-wrap { overflow-x: auto; }
.jr-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.88rem; min-width: 640px; }
.jr-table th, .jr-table td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--color-border-light); }
.jr-table thead th {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--color-text-muted); padding-bottom: 12px;
}
.jr-table th.jr-col-name, .jr-table td.jr-col-name { text-align: left; padding-left: 4px; min-width: 150px; }
.jr-table td.jr-col-name { font-weight: 500; color: var(--color-text); }
.jr-table th.jr-today-col { color: var(--color-accent); }
.jr-table td.jr-today-col { background: var(--color-accent-light); }
.jr-table tbody tr:hover td { background: rgba(0,0,0,0.012); }
.jr-table tbody tr:hover td.jr-today-col { background: var(--color-accent-light); }
.jr-table .jr-row-total td { border-bottom: none; border-top: 2px solid var(--color-border); font-weight: 600; padding-top: 14px; }
.jr-col-num { font-family: var(--font-mono); font-size: 0.85rem; color: var(--color-text-light); width: 56px; }
.jr-col-gap { font-family: var(--font-mono); font-size: 0.85rem; width: 64px; }
.jr-gap-neg { color: var(--color-accent); }
.jr-gap-ok { color: #3F7D58; }

.jr-tick {
  width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
  border: 1.5px solid var(--color-border); background: var(--color-surface);
  color: transparent; font-size: 0.8rem; line-height: 1;
  transition: all 0.15s ease;
}
.jr-tick:hover { border-color: var(--color-accent); transform: scale(1.08); }
.jr-tick.on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.jr-tick.future { opacity: 0.4; cursor: default; }
.jr-tick.future:hover { border-color: var(--color-border); transform: none; }

.jr-habit-name { display: inline-flex; align-items: center; gap: 8px; }
.jr-habit-edit {
  opacity: 0; cursor: pointer; border: none; background: transparent; padding: 2px 4px;
  color: var(--color-text-muted); font-size: 0.75rem; transition: opacity var(--transition);
}
tr:hover .jr-habit-edit { opacity: 1; }
.jr-habit-edit:hover { color: var(--color-accent); }

/* month view */
.jr-month { display: flex; flex-direction: column; gap: var(--space-md); }
.jr-month-row { display: grid; grid-template-columns: 170px 1fr auto; gap: var(--space-md); align-items: center; }
.jr-month-name { font-size: 0.88rem; font-weight: 500; }
.jr-month-name small { display: block; font-size: 0.72rem; color: var(--color-text-muted); font-weight: 400; }
.jr-dots { display: flex; gap: 3px; flex-wrap: wrap; }
.jr-dot-day.jr-week-end { margin-right: 9px; }
.jr-dot-day {
  width: 15px; height: 15px; border-radius: 4px; cursor: pointer;
  background: var(--color-bg-alt); border: 1px solid transparent; transition: all 0.15s ease;
}
.jr-dot-day:hover { border-color: var(--color-accent); }
.jr-dot-day.on { background: var(--color-accent); }
.jr-dot-day.future { opacity: 0.45; cursor: default; }
.jr-dot-day.today { border-color: var(--color-text); }
.jr-month-score { font-family: var(--font-mono); font-size: 0.82rem; color: var(--color-text-light); white-space: nowrap; }
.jr-month-legend { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--color-text-muted); margin-top: var(--space-sm); }

.jr-habits-empty { text-align: center; color: var(--color-text-muted); font-size: 0.9rem; padding: var(--space-lg) 0; }
.jr-link-btn { background: none; border: none; cursor: pointer; color: var(--color-accent); font-family: var(--font-sans); font-size: 0.9rem; text-decoration: underline; padding: 0 4px; }

/* Bar */
.jr-bar { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-lg); }
.jr-search { position: relative; flex: 1 1 240px; max-width: 380px; }
.jr-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 0.85rem; }
.jr-search input {
  width: 100%; padding: 10px 14px 10px 38px; font-family: var(--font-sans); font-size: 0.9rem;
  background: var(--color-bg-alt); border: 1.5px solid transparent; border-radius: 50px; color: var(--color-text);
}
.jr-search input:focus { outline: none; border-color: var(--color-accent); background: var(--color-surface); }
.jr-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.jr-tag-btn {
  cursor: pointer; font-family: var(--font-sans); font-size: 0.75rem; font-weight: 500;
  padding: 4px 12px; border-radius: 20px; border: 1px solid var(--color-border);
  background: transparent; color: var(--color-text-light); transition: all var(--transition);
}
.jr-tag-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
.jr-tag-btn.active { background: var(--color-accent-light); border-color: transparent; color: var(--color-accent); }

/* Editor */
.jr-editor {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-lg); margin-bottom: var(--space-xl);
  box-shadow: var(--shadow-md);
}
.jr-editor-row { display: flex; gap: var(--space-md); flex-wrap: wrap; }
.jr-field { display: block; margin-bottom: var(--space-md); flex: 1 1 100%; }
.jr-field > span { display: block; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 6px; }
.jr-field--date, .jr-field--time, .jr-field--mood { flex: 1 1 120px; }
.jr-hint { font-size: 0.78rem; color: var(--color-text-muted); margin: -6px 0 var(--space-md); }
.jr-editor-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; }
.jr-editor-btns { display: flex; gap: var(--space-sm); margin-left: auto; }
.jr-check { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--color-text-light); cursor: pointer; }
.jr-check input { accent-color: var(--color-accent); width: 16px; height: 16px; }

/* Sections */
.jr-section { margin-bottom: var(--space-2xl); }
.jr-section-title {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-sans); font-size: 0.78rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted);
  margin-bottom: var(--space-lg);
}
.jr-section-title i { color: var(--color-accent); }

/* Pinned: one horizontal row */
.jr-pinned-row {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr);
  align-items: start;
  gap: var(--space-lg); overflow-x: auto; padding-bottom: var(--space-sm);
  scroll-snap-type: x proximity;
}
.jr-pinned-row .jr-entry { scroll-snap-align: start; }

/* Timeline: masonry */
.jr-grid { columns: 3; column-gap: var(--space-lg); }
.jr-grid .jr-entry { break-inside: avoid; margin-bottom: var(--space-lg); display: inline-block; width: 100%; }

.jr-entry {
  position: relative; background: var(--color-surface);
  border: 1px solid var(--color-border-light); border-radius: var(--radius-md);
  padding: var(--space-lg); transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
}
.jr-entry:hover { border-color: var(--color-border); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.jr-entry--pinned { border-top: 3px solid var(--color-accent); }
.jr-entry-head { display: flex; align-items: baseline; gap: var(--space-md); flex-wrap: wrap; margin-bottom: 6px; }
.jr-entry-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-accent); letter-spacing: 0.02em; }
.jr-entry-time { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-text-muted); }
.jr-entry-mood { font-size: 1rem; }
.jr-entry-tools { margin-left: auto; display: flex; gap: 4px; opacity: 0; transition: opacity var(--transition); }
.jr-entry:hover .jr-entry-tools, .jr-entry:focus-within .jr-entry-tools { opacity: 1; }
.jr-tool {
  cursor: pointer; background: transparent; border: none; padding: 4px 7px; border-radius: var(--radius-sm);
  color: var(--color-text-muted); font-size: 0.8rem;
}
.jr-tool:hover { background: var(--color-bg-alt); color: var(--color-accent); }
.jr-tool.on { color: var(--color-accent); }
.jr-entry-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin-bottom: var(--space-sm); }
.jr-entry-body { font-size: 0.92rem; line-height: 1.75; color: var(--color-text); }
.jr-entry-body > *:not(:last-child) { margin-bottom: 0.9em; }
.jr-entry-body h3, .jr-entry-body h4, .jr-entry-body h5 { font-family: var(--font-serif); font-size: 1rem; }
.jr-entry-body ul, .jr-entry-body ol { padding-left: 1.3em; }
.jr-entry-body li { margin-bottom: 0.3em; }
.jr-entry-body blockquote { border-left: 3px solid var(--color-border); padding-left: 1em; color: var(--color-text-light); font-style: italic; }
.jr-entry-body code { font-family: var(--font-mono); font-size: 0.85em; background: var(--color-bg-alt); padding: 2px 6px; border-radius: 4px; }
.jr-entry-body pre { background: var(--color-bg-alt); padding: var(--space-md); border-radius: var(--radius-sm); overflow-x: auto; }
.jr-entry-body pre code { background: transparent; padding: 0; }
.jr-entry-body img { max-width: 100%; border-radius: var(--radius-sm); }
.jr-entry-body hr { border: none; border-top: 1px solid var(--color-border-light); }
.jr-entry-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: var(--space-md); }
.jr-entry-fold { display: inline-block; margin-top: 8px; font-size: 0.82rem; color: var(--color-accent); cursor: pointer; background: none; border: none; padding: 0; font-family: var(--font-sans); }
.jr-clamp { max-height: 14em; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 66%, transparent); mask-image: linear-gradient(180deg, #000 66%, transparent); }

.jr-empty { text-align: center; color: var(--color-text-muted); padding: var(--space-2xl) 0; }

@media (max-width: 1100px) { .jr-grid { columns: 2; } }
@media (max-width: 720px) {
  .jr-grid { columns: 1; }
  .jr-head { flex-direction: column; }

  .jr-btn span { display: none; }
  .jr-btn--accent span, .jr-btn--sm span { display: inline; }
  .jr-habits { padding: var(--space-md); }
  .jr-month-row { grid-template-columns: 1fr; gap: 6px; }
  .jr-pinned-row { grid-auto-columns: minmax(84%, 1fr); }
}

      addHabit: '添加习惯', noHabits: '还没有习惯。', seedHabits: '先用几条示例开始',

      days: '天', dayShort: ['一','二','三','四','五','六','日'],
      habitName: '习惯名称：', habitTarget: '每周目标次数（1–7）：',
      habitDelete: '删除这个习惯及其全部打卡记录？',
      habitEditName: '重命名（留空则删除）：',
      monthLegend: '每个小方块是当月的一天',
      seedList: ['进工作室手机倒扣', '每件事开始前计时', '多喝水', '写一条纪录']

  };
  var T = STR[LANG];

  root.querySelectorAll('[data-i18n]').forEach(function (el) {
    var k = el.getAttribute('data-i18n'); if (T[k]) el.textContent = T[k];

  root.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
    var k = el.getAttribute('data-i18n-ph'); if (T[k]) el.setAttribute('placeholder', T[k]);
  });

  // ---------- crypto ----------
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64(buf) {
    var bytes = new Uint8Array(buf), s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function unb64(str) {
    var s = atob(str), bytes = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
    return bytes;
  }

    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }

    var salt = crypto.getRandomValues(new Uint8Array(16));

      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj)));
    }).then(function (ct) {
      return { v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
    });

    return deriveKey(pass, unb64(file.salt), file.iter || ITER).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(file.iv) }, key, unb64(file.ct));
    }).then(function (plain) { return JSON.parse(dec.decode(plain)); });
  }

  // ---------- markdown ----------
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inline(raw) {
    return esc(raw)
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) {
        return /^(https?:|data:image\/)/i.test(src) ? '<img src="' + src + '" alt="' + alt + '">' : m;
      })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, href) {
        return /^(https?:|mailto:|\/)/i.test(href) ? '<a href="' + href + '" target="_blank" rel="noopener">' + txt + '</a>' : m;
      })
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

  function md(src) {
    var lines = (src || '').split(/\r?\n/), out = [], list = null, para = [], code = false, buf = [];
    function flushPara() { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } }
    function flushList() { if (list) { out.push('<' + list.tag + '>' + list.items.join('') + '</' + list.tag + '>'); list = null; } }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (/^```/.test(ln)) {
        if (code) { out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); buf = []; code = false; }
        else { flushPara(); flushList(); code = true; }
        continue;
      }
      if (code) { buf.push(ln); continue; }
      if (/^\s*$/.test(ln)) { flushPara(); flushList(); continue; }
      if (/^(-{3,}|\*{3,})\s*$/.test(ln)) { flushPara(); flushList(); out.push('<hr>'); continue; }
      var h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) { flushPara(); flushList(); var lv = Math.min(h[1].length + 2, 6); out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); continue; }
      var q = ln.match(/^>\s?(.*)$/);
      if (q) { flushPara(); flushList(); out.push('<blockquote>' + inline(q[1]) + '</blockquote>'); continue; }
      var ul = ln.match(/^\s*[-*+]\s+(.*)$/);
      var ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        flushPara();
        var tag = ul ? 'ul' : 'ol';
        if (!list || list.tag !== tag) { flushList(); list = { tag: tag, items: [] }; }
        list.items.push('<li>' + inline((ul || ol)[1]) + '</li>');
        continue;
      }
      flushList(); para.push(ln);
    }
    if (code && buf.length) out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
    flushPara(); flushList();
    return out.join('');
  }

  // ---------- date helpers ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }

    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());

    el('jr-gate-btn').textContent = T.unlock; el('jr-pass2').classList.add('jr-hidden');
    state.isNew = false; setMsg(''); el('jr-pass').focus();

  // ================= habits =================

  function toggleCheck(hid, date) {

    var day = state.checks[date] || (state.checks[date] = []);
    var i = day.indexOf(hid);

    markDirty(true); renderHabits();
  }
  function countInRange(hid, from, to) {
    var n = 0, d = new Date(from.getTime());
    while (iso(d) <= iso(to)) { if (isChecked(hid, iso(d))) n++; d = addDays(d, 1); }
    return n;
  }
  function bestStreak(hid) {
    var dates = Object.keys(state.checks).filter(function (d) { return isChecked(hid, d); }).sort();
    var best = 0, cur = 0, prev = null;
    dates.forEach(function (d) {
      if (prev && iso(addDays(parseISO(prev), 1)) === d) cur++; else cur = 1;

      prev = d;
    });

  }

  function renderStats() {
    var wrap = el('jr-stats');
    if (!state.habits.length) { wrap.innerHTML = ''; return; }
    var ws = mondayOf(state.anchor), we = addDays(ws, 6);
    var m0 = new Date(state.anchor.getFullYear(), state.anchor.getMonth(), 1);
    var m1 = new Date(state.anchor.getFullYear(), state.anchor.getMonth() + 1, 0);
    var mdays = m1.getDate();
    var doneW = 0, targetW = 0, doneM = 0, targetM = 0, doneT = 0, streak = 0;
    state.habits.forEach(function (h) {
      doneW += countInRange(h.id, ws, we);
      targetW += (h.target || 7);
      doneM += countInRange(h.id, m0, m1);
      targetM += Math.round((h.target || 7) * mdays / 7);
      if (isChecked(h.id, TODAY)) doneT++;
      streak = Math.max(streak, bestStreak(h.id));
    });
    var rateW = targetW ? Math.round(doneW * 100 / targetW) : 0;
    var rateM = targetM ? Math.round(doneM * 100 / targetM) : 0;
    var rateT = state.habits.length ? Math.round(doneT * 100 / state.habits.length) : 0;

    function card(label, value, sub, pct) {

        '</div>';

      card(T.statToday, doneT, '/ ' + state.habits.length, rateT) +
      card(T.statDone, doneW, '/ ' + targetW + ' · ' + rateW + '%', rateW) +
      card(T.statMonth, doneM, '/ ' + targetM + ' · ' + rateM + '%', rateM) +

  }

  function renderWeek() {

    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i), isToday = iso(d) === TODAY;
      head += '<th class="' + (isToday ? 'jr-today-col' : '') + '">' + T.dayShort[i] +

    }
    head += '<th class="jr-col-num">' + esc(T.done) + '</th><th class="jr-col-num">' + esc(T.target) +
            '</th><th class="jr-col-gap">' + esc(T.gap) + '</th></tr></thead>';

    var body = '<tbody>', totDone = 0, totTarget = 0;
    state.habits.forEach(function (h) {
      var row = '<tr data-habit="' + h.id + '"><td class="jr-col-name"><span class="jr-habit-name">' + esc(h.name) +
        '<button class="jr-habit-edit" data-edit="' + h.id + '" title="edit"><i class="fas fa-pen"></i></button></span></td>';
      var done = 0;
      for (var i = 0; i < 7; i++) {
        var d = addDays(ws, i), ds = iso(d), on = isChecked(h.id, ds), future = ds > TODAY;
        if (on) done++;
        row += '<td class="' + (ds === TODAY ? 'jr-today-col' : '') + '">' +
          '<button class="jr-tick ' + (on ? 'on ' : '') + (future ? 'future' : '') + '" data-h="' + h.id + '" data-d="' + ds + '">\u2713</button></td>';
      }
      var target = h.target || 7, gap = done - target;
      totDone += done; totTarget += target;
      row += '<td class="jr-col-num">' + done + '</td><td class="jr-col-num">' + target + '</td>' +
        '<td class="jr-col-gap ' + (gap >= 0 ? 'jr-gap-ok' : 'jr-gap-neg') + '">' + (gap >= 0 ? '☺' : '&lt;' + Math.abs(gap) + '&gt;') + '</td></tr>';
      body += row;
    });
    var totGap = totDone - totTarget;
    body += '<tr class="jr-row-total"><td class="jr-col-name">' + esc(T.total) + '</td><td colspan="7"></td>' +
      '<td class="jr-col-num">' + totDone + '</td><td class="jr-col-num">' + totTarget + '</td>' +
      '<td class="jr-col-gap ' + (totGap >= 0 ? 'jr-gap-ok' : 'jr-gap-neg') + '">' + (totGap >= 0 ? '☺' : '&lt;' + Math.abs(totGap) + '&gt;') + '</td></tr></tbody>';
    t.innerHTML = head + body;

    t.querySelectorAll('.jr-tick').forEach(function (b) {
      b.addEventListener('click', function () { toggleCheck(b.getAttribute('data-h'), b.getAttribute('data-d')); });
    });
    t.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { editHabit(b.getAttribute('data-edit')); });
    });
  }

  function renderMonth() {
    var y = state.anchor.getFullYear(), m = state.anchor.getMonth();
    var days = new Date(y, m + 1, 0).getDate();
    var wrap = el('jr-month'), html = '';
    state.habits.forEach(function (h) {
      var dots = '', done = 0;
      for (var i = 1; i <= days; i++) {
        var ds = y + '-' + pad(m + 1) + '-' + pad(i);
        var on = isChecked(h.id, ds), future = ds > TODAY;
        if (on) done++;
        var wd = new Date(y, m, i).getDay();
        dots += '<button class="jr-dot-day ' + (on ? 'on ' : '') + (future ? 'future ' : '') +
          (ds === TODAY ? 'today ' : '') + (wd === 0 ? 'jr-week-end' : '') +
          '" data-h="' + h.id + '" data-d="' + ds + '" title="' + ds + '"></button>';
      }
      var goal = Math.round((h.target || 7) * days / 7);
      var pct = goal ? Math.round(done * 100 / goal) : 0;
      html += '<div class="jr-month-row">' +
        '<div class="jr-month-name">' + esc(h.name) + '<small>' + (h.target || 7) + '×/' + (LANG === 'zh' ? '周' : 'wk') + '</small></div>' +
        '<div class="jr-dots">' + dots + '</div>' +
        '<div class="jr-month-score">' + done + ' / ' + goal + ' · ' + pct + '%</div></div>';
    });
    wrap.innerHTML = html + '<p class="jr-month-legend"><span class="jr-dot-day on" style="cursor:default"></span>' + esc(T.monthLegend) + '</p>';
    wrap.querySelectorAll('.jr-dot-day[data-h]').forEach(function (b) {
      b.addEventListener('click', function () { toggleCheck(b.getAttribute('data-h'), b.getAttribute('data-d')); });
    });
  }

  function renderHabits() {
    var has = state.habits.length > 0;
    el('jr-habits-empty').classList.toggle('jr-hidden', has);
    el('jr-week-wrap').classList.toggle('jr-hidden', !has || state.view !== 'week');
    el('jr-month').classList.toggle('jr-hidden', !has || state.view !== 'month');
    var range;
    if (state.view === 'week') {
      var ws = mondayOf(state.anchor), we = addDays(ws, 6);
      range = LANG === 'zh'
        ? (ws.getMonth() + 1) + '月' + ws.getDate() + '日 — ' + (we.getMonth() + 1) + '月' + we.getDate() + '日'
        : (ws.getMonth() + 1) + '/' + ws.getDate() + ' — ' + (we.getMonth() + 1) + '/' + we.getDate() + ', ' + we.getFullYear();
    } else {
      range = LANG === 'zh'
        ? state.anchor.getFullYear() + '年' + (state.anchor.getMonth() + 1) + '月'
        : ['January','February','March','April','May','June','July','August','September','October','November','December'][state.anchor.getMonth()] + ' ' + state.anchor.getFullYear();
    }
    el('jr-habits-range').textContent = range;
    renderStats();
    if (!has) { el('jr-week-table').innerHTML = ''; el('jr-month').innerHTML = ''; return; }
    if (state.view === 'week') renderWeek(); else renderMonth();
  }

  function addHabit() {
    var name = prompt(T.habitName); if (!name) return;
    var tRaw = prompt(T.habitTarget, '7'); if (tRaw === null) return;
    var target = Math.max(1, Math.min(7, parseInt(tRaw, 10) || 7));
    state.habits.push({ id: uid(), name: name.trim(), target: target, created: new Date().toISOString() });
    markDirty(true); renderHabits();
  }
  function editHabit(id) {
    var h = null;
    state.habits.forEach(function (x) { if (x.id === id) h = x; });
    if (!h) return;
    var name = prompt(T.habitEditName, h.name);
    if (name === null) return;
    if (!name.trim()) {
      if (!confirm(T.habitDelete)) return;
      state.habits = state.habits.filter(function (x) { return x.id !== id; });
      Object.keys(state.checks).forEach(function (d) {
        state.checks[d] = state.checks[d].filter(function (x) { return x !== id; });
        if (!state.checks[d].length) delete state.checks[d];
      });
      markDirty(true); renderHabits(); return;
    }
    var tRaw = prompt(T.habitTarget, String(h.target || 7));
    if (tRaw !== null) h.target = Math.max(1, Math.min(7, parseInt(tRaw, 10) || 7));
    h.name = name.trim();
    markDirty(true); renderHabits();
  }

  el('jr-habit-add').addEventListener('click', addHabit);
  el('jr-habit-seed').addEventListener('click', function () {
    T.seedList.forEach(function (n) {
      state.habits.push({ id: uid(), name: n, target: 7, created: new Date().toISOString() });
    });
    markDirty(true); renderHabits();
  });
  root.querySelectorAll('.jr-seg-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      root.querySelectorAll('.jr-seg-btn').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      state.view = b.getAttribute('data-view');
      renderHabits();
    });
  });
  el('jr-prev').addEventListener('click', function () {
    state.anchor = state.view === 'week' ? addDays(state.anchor, -7)
      : new Date(state.anchor.getFullYear(), state.anchor.getMonth() - 1, 1);
    renderHabits();
  });
  el('jr-next').addEventListener('click', function () {
    state.anchor = state.view === 'week' ? addDays(state.anchor, 7)
      : new Date(state.anchor.getFullYear(), state.anchor.getMonth() + 1, 1);
    renderHabits();
  });
  el('jr-today').addEventListener('click', function () { state.anchor = new Date(); renderHabits(); });

  // ================= entries =================
  function fmtDate(d) {
    if (!d) return '';
    var parts = d.split('-'); if (parts.length !== 3) return d;
    if (LANG === 'zh') return parts[0] + '年' + (+parts[1]) + '月' + (+parts[2]) + '日';
    var mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return mons[(+parts[1]) - 1] + ' ' + (+parts[2]) + ', ' + parts[0];
  }
  function matches(en) {
    if (state.tag && (en.tags || []).indexOf(state.tag) === -1) return false;
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    return ((en.title || '') + ' ' + (en.body || '') + ' ' + (en.tags || []).join(' ')).toLowerCase().indexOf(q) !== -1;
  }
  function entryNode(en) {
    var d = document.createElement('article');
    d.className = 'jr-entry' + (en.pinned ? ' jr-entry--pinned' : '');
    var head = '<div class="jr-entry-head">' +
      '<span class="jr-entry-date">' + esc(fmtDate(en.date)) + '</span>' +
      (en.time ? '<span class="jr-entry-time">' + esc(en.time) + '</span>' : '') +
      (en.mood ? '<span class="jr-entry-mood">' + esc(en.mood) + '</span>' : '') +
      '<span class="jr-entry-tools">' +
        '<button class="jr-tool' + (en.pinned ? ' on' : '') + '" data-act="pin" title="pin"><i class="fas fa-thumbtack"></i></button>' +
        '<button class="jr-tool" data-act="edit" title="edit"><i class="fas fa-pen"></i></button>' +
      '</span></div>';
    var tags = (en.tags && en.tags.length)
      ? '<div class="jr-entry-tags">' + en.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
      : '';
    d.innerHTML = head + (en.title ? '<h3 class="jr-entry-title">' + esc(en.title) + '</h3>' : '') +
      '<div class="jr-entry-body">' + md(en.body) + '</div>' + tags;
    d.querySelector('[data-act="pin"]').addEventListener('click', function () {
      en.pinned = !en.pinned; en.updated = new Date().toISOString(); markDirty(true); renderEntries();
    });
    d.querySelector('[data-act="edit"]').addEventListener('click', function () { openEditor(en); });
    var bodyEl = d.querySelector('.jr-entry-body');
    requestAnimationFrame(function () {
      if (bodyEl.scrollHeight > 280) {
        bodyEl.classList.add('jr-clamp');
        var b = document.createElement('button');
        b.className = 'jr-entry-fold'; b.textContent = T.more;
        b.addEventListener('click', function () {
          var closed = bodyEl.classList.toggle('jr-clamp');
          b.textContent = closed ? T.more : T.less;
        });
        bodyEl.insertAdjacentElement('afterend', b);
      }
    });
    return d;
  }
  function renderEntries() {
    var sorted = state.entries.slice().sort(function (a, b) {
      var ka = (a.date || '') + ' ' + (a.time || ''), kb = (b.date || '') + ' ' + (b.time || '');
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
    var shown = sorted.filter(matches);
    var pinned = shown.filter(function (e) { return e.pinned; });
    var rest = shown.filter(function (e) { return !e.pinned; });

    var pl = el('jr-pinned'), tl = el('jr-timeline');
    pl.innerHTML = ''; tl.innerHTML = '';
    pinned.forEach(function (e) { pl.appendChild(entryNode(e)); });
    rest.forEach(function (e) { tl.appendChild(entryNode(e)); });
    el('jr-pinned-wrap').classList.toggle('jr-hidden', pinned.length === 0);
    el('jr-empty').classList.toggle('jr-hidden', shown.length !== 0);

    var n = state.entries.length;
    el('jr-count').textContent = n + ' ' + (n === 1 ? T.entry : T.entries);

    var tags = {}, order = [];
    state.entries.forEach(function (e) {
      (e.tags || []).forEach(function (t) { if (!tags[t]) { tags[t] = 1; order.push(t); } else tags[t]++; });
    });
    var bar = el('jr-tagbar'); bar.innerHTML = '';
    order.sort(function (a, b) { return tags[b] - tags[a]; }).slice(0, 12).forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'jr-tag-btn' + (state.tag === t ? ' active' : '');
      b.textContent = t;
      b.addEventListener('click', function () { state.tag = state.tag === t ? null : t; renderEntries(); });
      bar.appendChild(b);
    });
  }
  function renderAll() { renderHabits(); renderEntries(); }

  // ---------- editor ----------
  function openEditor(en) {
    state.editing = en || null;
    var now = new Date();
    el('jr-f-date').value = en ? en.date : iso(now);
    el('jr-f-time').value = en ? (en.time || '') : pad(now.getHours()) + ':' + pad(now.getMinutes());
    el('jr-f-mood').value = en ? (en.mood || '') : '';
    el('jr-f-title').value = en ? (en.title || '') : '';
    el('jr-f-body').value = en ? (en.body || '') : '';
    el('jr-f-tags').value = en ? (en.tags || []).join(', ') : '';
    el('jr-f-pin').checked = en ? !!en.pinned : false;
    el('jr-delete').classList.toggle('jr-hidden', !en);
    el('jr-editor').classList.remove('jr-hidden');
    el('jr-editor').scrollIntoView({ behavior: 'smooth', block: 'center' });
    el('jr-f-body').focus();
  }
  function closeEditor() { el('jr-editor').classList.add('jr-hidden'); state.editing = null; }

  el('jr-new').addEventListener('click', function () { openEditor(null); });
  el('jr-cancel').addEventListener('click', function (e) { e.preventDefault(); closeEditor(); });
  el('jr-delete').addEventListener('click', function (e) {
    e.preventDefault();
    if (!state.editing || !confirm(T.confirmDelete)) return;
    state.entries = state.entries.filter(function (x) { return x !== state.editing; });
    closeEditor(); markDirty(true); renderEntries();
  });
  el('jr-commit').addEventListener('click', function (e) {
    e.preventDefault();
    var body = el('jr-f-body').value.trim(), title = el('jr-f-title').value.trim();
    if (!body && !title) { closeEditor(); return; }
    var tags = el('jr-f-tags').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    var now = new Date().toISOString();
    var en = state.editing;
    if (!en) { en = { id: uid(), created: now }; state.entries.push(en); }
    en.date = el('jr-f-date').value;
    en.time = el('jr-f-time').value;
    en.mood = el('jr-f-mood').value.trim();
    en.title = title; en.body = body; en.tags = tags;
    en.pinned = el('jr-f-pin').checked; en.updated = now;
    closeEditor(); markDirty(true); renderEntries();
  });

  function embedImage(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1400, w = img.width, h = img.height;
        if (w > max) { h = Math.round(h * max / w); w = max; }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        var url = cv.toDataURL('image/jpeg', 0.82);
        var ta = el('jr-f-body');
        var pos = ta.selectionStart || ta.value.length;
        ta.value = ta.value.slice(0, pos) + '\n![](' + url + ')\n' + ta.value.slice(pos);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  el('jr-f-body').addEventListener('paste', function (e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        e.preventDefault(); embedImage(items[i].getAsFile()); return;
      }
    }
  });
  el('jr-f-body').addEventListener('dragover', function (e) { e.preventDefault(); });
  el('jr-f-body').addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && f.type.indexOf('image/') === 0) { e.preventDefault(); embedImage(f); }
  });

  el('jr-q').addEventListener('input', function () { state.q = this.value.trim(); renderEntries(); });

  // ---------- menu / io ----------
  el('jr-more').addEventListener('click', function (e) {
    e.stopPropagation(); el('jr-menu').classList.toggle('jr-hidden');
  });
  document.addEventListener('click', function () { el('jr-menu').classList.add('jr-hidden'); });
  el('jr-menu').addEventListener('click', function (e) { e.stopPropagation(); });

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function payload() {
    return { entries: state.entries, habits: state.habits, checks: state.checks };
  }
  el('jr-save').addEventListener('click', function () {
    encryptPayload(payload(), state.pass).then(function (file) {
      download('entries.json', JSON.stringify(file));
      markDirty(false);
      alert(T.exported);
    });
  });
  el('jr-backup').addEventListener('click', function () {
    el('jr-menu').classList.add('jr-hidden');
    download('journal-backup-' + TODAY + '.json', JSON.stringify(payload(), null, 2));
  });
  el('jr-import').addEventListener('click', function () {
    el('jr-menu').classList.add('jr-hidden'); el('jr-file').click();
  });
  el('jr-file').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var j = JSON.parse(fr.result);
        var list = Array.isArray(j) ? j : j.entries;
        if (!Array.isArray(list)) throw 0;
        var have = {};
        state.entries.forEach(function (e) { have[e.id] = 1; });
        var added = 0;
        list.forEach(function (e) {
          if (!e || !e.id) { e = e || {}; e.id = uid(); }
          if (!have[e.id]) { state.entries.push(e); have[e.id] = 1; added++; }
        });
        if (j.habits && Array.isArray(j.habits)) {
          var hh = {};
          state.habits.forEach(function (h) { hh[h.id] = 1; });
          j.habits.forEach(function (h) { if (h && h.id && !hh[h.id]) { state.habits.push(h); hh[h.id] = 1; } });
        }
        if (j.checks && typeof j.checks === 'object') {
          Object.keys(j.checks).forEach(function (d) {
            var cur = state.checks[d] || (state.checks[d] = []);
            (j.checks[d] || []).forEach(function (id) { if (cur.indexOf(id) === -1) cur.push(id); });
          });
        }
        markDirty(true); renderAll(); alert(T.importOk + added);
      } catch (err) { alert(T.importFail); }
    };
    fr.readAsText(f); this.value = '';
  });
  el('jr-chpass').addEventListener('click', function () {
    el('jr-menu').classList.add('jr-hidden');
    var p1 = prompt(T.newPass); if (p1 === null) return;
    if (p1.length < 8) return alert(T.tooShort);
    var p2 = prompt(T.newPass2); if (p2 === null) return;
    if (p1 !== p2) return alert(T.mismatch);
    state.pass = p1; markDirty(true); alert(T.passChanged);
  });
  el('jr-lock').addEventListener('click', function () { el('jr-menu').classList.add('jr-hidden'); lock(false); });

  // ---------- safety ----------
  window.addEventListener('beforeunload', function (e) {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  var idle = null;
  function resetIdle() {
    clearTimeout(idle);
    idle = setTimeout(function () { if (state.pass && !state.dirty) lock(true); }, 30 * 60 * 1000);
  }
  ['click', 'keydown', 'mousemove', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, resetIdle, { passive: true });
  });
  resetIdle();
})();
</script>
