<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,sans-serif" role="img" aria-label="左侧：每份报告必须包含的六项。右侧：四档汇报时机——直接做不用说、先做做完报、先问再做、立刻打断" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">汇报约定：在需要它之前先定好</text>

  <rect x="30" y="50" width="360" height="330" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="52" y="76" font-size="12" font-weight="600" fill="#8A8178">每份报告必须包含</text>

  <circle cx="62" cy="106" r="11" fill="#FFF3F0" stroke="#D4704A" stroke-width="1.2"/>
  <text x="62" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#D4704A">1</text>
  <text x="84" y="104" font-size="12.5" font-weight="600" fill="#2D2D2D">上一轮我提的要求和反馈</text>
  <text x="84" y="121" font-size="11.5" fill="#8A8178">用一行字抓出「我们在做两件事」</text>

  <circle cx="62" cy="152" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">2</text>
  <text x="84" y="157" font-size="12.5" fill="#2D2D2D">这一轮实际做了什么</text>

  <circle cx="62" cy="190" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">3</text>
  <text x="84" y="188" font-size="12.5" fill="#2D2D2D">结果，包括意料之外的发现</text>
  <text x="84" y="205" font-size="11.5" fill="#8A8178">意外那部分才是值钱的</text>

  <circle cx="62" cy="236" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">4</text>
  <text x="84" y="241" font-size="12.5" fill="#2D2D2D">结论，要当成结论写出来</text>

  <circle cx="62" cy="274" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">5</text>
  <text x="84" y="279" font-size="12.5" fill="#2D2D2D">如果有多条路，分别是什么</text>

  <circle cx="62" cy="312" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">6</text>
  <text x="84" y="317" font-size="12.5" fill="#2D2D2D">推荐的下一步</text>

  <line x1="52" y1="338" x2="368" y2="338" stroke="#EFEBE5" stroke-width="1"/>
  <text x="52" y="358" font-size="11.5" fill="#6B6B6B">写给一个刚从门外进来的同事看——信息密度高，</text>
  <text x="52" y="374" font-size="11.5" fill="#6B6B6B">不要客套话，不要没解释过的缩写。</text>

  <rect x="410" y="50" width="360" height="330" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="432" y="76" font-size="12" font-weight="600" fill="#8A8178">以及什么时候报</text>

  <rect x="432" y="92" width="316" height="58" rx="8" fill="#F6F7F5"/>
  <rect x="432" y="92" width="4" height="58" rx="2" fill="#B9C4B2"/>
  <text x="450" y="114" font-size="12.5" font-weight="600" fill="#2D2D2D">直接做，不用说</text>
  <text x="450" y="135" font-size="11.5" fill="#6B6B6B">格式整理、改名，一条命令能撤回</text>
  <text x="450" y="149" font-size="11.5" fill="#6B6B6B">的事。</text>

  <rect x="432" y="160" width="316" height="58" rx="8" fill="#F5F6FA"/>
  <rect x="432" y="160" width="4" height="58" rx="2" fill="#8FA3D8"/>
  <text x="450" y="182" font-size="12.5" font-weight="600" fill="#2D2D2D">先做，做完报</text>
  <text x="450" y="203" font-size="11.5" fill="#6B6B6B">计划之内的事。我想知道，但不需</text>
  <text x="450" y="217" font-size="11.5" fill="#6B6B6B">要提前批准。</text>

  <rect x="432" y="228" width="316" height="58" rx="8" fill="#FDF3EE"/>
  <rect x="432" y="228" width="4" height="58" rx="2" fill="#E2A27A"/>
  <text x="450" y="250" font-size="12.5" font-weight="600" fill="#2D2D2D">先问，再做</text>
  <text x="450" y="271" font-size="11.5" fill="#6B6B6B">设计、指标、数据、方向。任何烧钱</text>
  <text x="450" y="285" font-size="11.5" fill="#6B6B6B">或撤回起来麻烦的事。</text>

  <rect x="432" y="296" width="316" height="62" rx="8" fill="#FBEDE8"/>
  <rect x="432" y="296" width="4" height="62" rx="2" fill="#C24E25"/>
  <text x="450" y="318" font-size="12.5" font-weight="600" fill="#C24E25">立刻打断我</text>
  <text x="450" y="339" font-size="11.5" fill="#6B6B6B">出现了和计划所依赖的假设相矛盾的</text>
  <text x="450" y="353" font-size="11.5" fill="#6B6B6B">结果。不要等。</text>
</svg>
