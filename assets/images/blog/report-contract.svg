<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="Left: the six slots every report must contain. Right: four tiers governing when the agent acts silently, acts then reports, asks first, or interrupts immediately" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">The reporting contract, agreed before it is needed</text>

  <!-- Left: six slots -->
  <rect x="30" y="50" width="360" height="330" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="52" y="76" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#8A8178">EVERY REPORT CONTAINS</text>

  <circle cx="62" cy="106" r="11" fill="#FFF3F0" stroke="#D4704A" stroke-width="1.2"/>
  <text x="62" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#D4704A">1</text>
  <text x="84" y="104" font-size="12.5" font-weight="600" fill="#2D2D2D">What I asked for last round</text>
  <text x="84" y="121" font-size="11.5" fill="#8A8178">the line that catches two different problems</text>

  <circle cx="62" cy="152" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">2</text>
  <text x="84" y="157" font-size="12.5" fill="#2D2D2D">What was actually done</text>

  <circle cx="62" cy="190" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">3</text>
  <text x="84" y="188" font-size="12.5" fill="#2D2D2D">Results, including the unexpected</text>
  <text x="84" y="205" font-size="11.5" fill="#8A8178">the surprise is the part worth having</text>

  <circle cx="62" cy="236" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">4</text>
  <text x="84" y="241" font-size="12.5" fill="#2D2D2D">The conclusion, stated as one</text>

  <circle cx="62" cy="274" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">5</text>
  <text x="84" y="279" font-size="12.5" fill="#2D2D2D">The options, if there are several</text>

  <circle cx="62" cy="312" r="11" fill="#F6F4F1" stroke="#C9C2B8" stroke-width="1.2"/>
  <text x="62" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#8A8178">6</text>
  <text x="84" y="317" font-size="12.5" fill="#2D2D2D">The recommended next step</text>

  <line x1="52" y1="338" x2="368" y2="338" stroke="#EFEBE5" stroke-width="1"/>
  <text x="52" y="358" font-size="11.5" fill="#6B6B6B">Written for a colleague who was out of the room —</text>
  <text x="52" y="373" font-size="11.5" fill="#6B6B6B">dense, no filler, no unexplained abbreviations.</text>

  <!-- Right: four tiers -->
  <rect x="410" y="50" width="360" height="330" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="432" y="76" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#8A8178">AND WHEN TO REPORT</text>

  <rect x="432" y="92" width="316" height="58" rx="8" fill="#F6F7F5"/>
  <rect x="432" y="92" width="4" height="58" rx="2" fill="#B9C4B2"/>
  <text x="450" y="114" font-size="12.5" font-weight="600" fill="#2D2D2D">Do it, don't mention it</text>
  <text x="450" y="134" font-size="11.5" fill="#6B6B6B">Formatting, renaming, anything one</text>
  <text x="450" y="148" font-size="11.5" fill="#6B6B6B">command undoes.</text>

  <rect x="432" y="160" width="316" height="58" rx="8" fill="#F5F6FA"/>
  <rect x="432" y="160" width="4" height="58" rx="2" fill="#8FA3D8"/>
  <text x="450" y="182" font-size="12.5" font-weight="600" fill="#2D2D2D">Do it, then report</text>
  <text x="450" y="202" font-size="11.5" fill="#6B6B6B">Inside the agreed plan. I want to know,</text>
  <text x="450" y="216" font-size="11.5" fill="#6B6B6B">not to pre-approve.</text>

  <rect x="432" y="228" width="316" height="58" rx="8" fill="#FDF3EE"/>
  <rect x="432" y="228" width="4" height="58" rx="2" fill="#E2A27A"/>
  <text x="450" y="250" font-size="12.5" font-weight="600" fill="#2D2D2D">Ask first, then do</text>
  <text x="450" y="270" font-size="11.5" fill="#6B6B6B">Design, metric, data, direction. Anything</text>
  <text x="450" y="284" font-size="11.5" fill="#6B6B6B">expensive or annoying to undo.</text>

  <rect x="432" y="296" width="316" height="62" rx="8" fill="#FBEDE8"/>
  <rect x="432" y="296" width="4" height="62" rx="2" fill="#C24E25"/>
  <text x="450" y="318" font-size="12.5" font-weight="600" fill="#C24E25">Interrupt me</text>
  <text x="450" y="338" font-size="11.5" fill="#6B6B6B">A result that contradicts an assumption</text>
  <text x="450" y="352" font-size="11.5" fill="#6B6B6B">the plan is built on. Don't wait.</text>
</svg>
