<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,sans-serif" role="img" aria-label="协作闭环的一轮：我定问题和边界，agent 在边界内执行，按固定格式写报告，第二个模型冷读这份报告，我读完两份意见再决定下一步" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="alz-o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D4704A"/>
    </marker>
    <marker id="alz-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A6DD4"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">一轮协作闭环</text>

  <rect x="38" y="52" width="258" height="112" rx="10" fill="#FFF3F0" stroke="#D4704A" stroke-width="1.5"/>
  <text x="58" y="78" font-size="12" font-weight="600" fill="#D4704A">我</text>
  <text x="58" y="103" font-size="12.5" fill="#555">定问题、定边界、定指标。</text>
  <text x="58" y="124" font-size="12.5" fill="#555">读完两份意见，合成一份</text>
  <text x="58" y="145" font-size="12.5" fill="#555">回复发回去。</text>

  <rect x="504" y="52" width="258" height="112" rx="10" fill="#F0F4FF" stroke="#4A6DD4" stroke-width="1.5"/>
  <text x="524" y="78" font-size="12" font-weight="600" fill="#4A6DD4">CODING AGENT</text>
  <text x="524" y="103" font-size="12.5" fill="#555">在约定边界内执行。要动</text>
  <text x="524" y="124" font-size="12.5" fill="#555">设计、指标、数据或方向，</text>
  <text x="524" y="145" font-size="12.5" fill="#555">先问再做。</text>

  <rect x="504" y="252" width="258" height="112" rx="10" fill="#FFFFFF" stroke="#C9C2B8" stroke-width="1.5"/>
  <text x="524" y="278" font-size="12" font-weight="600" fill="#8A8178">报告</text>
  <text x="524" y="303" font-size="12.5" fill="#555">固定六项：上轮要求 · 做了</text>
  <text x="524" y="324" font-size="12.5" fill="#555">什么 · 结果 · 结论 · 可选</text>
  <text x="524" y="345" font-size="12.5" fill="#555">方案 · 推荐的下一步</text>

  <rect x="38" y="252" width="258" height="112" rx="10" fill="#F0F4FF" stroke="#4A6DD4" stroke-width="1.5"/>
  <text x="58" y="278" font-size="12" font-weight="600" fill="#4A6DD4">第二个模型</text>
  <text x="58" y="303" font-size="12.5" fill="#555">冷读同一份报告，对前六</text>
  <text x="58" y="324" font-size="12.5" fill="#555">小时的工作没有任何投入，</text>
  <text x="58" y="345" font-size="12.5" fill="#555">更容易看见没验证的那步。</text>

  <path d="M300 108 L498 108" stroke="#D4704A" stroke-width="1.8" marker-end="url(#alz-o)"/>
  <text x="399" y="98" text-anchor="middle" font-size="11.5" fill="#9A8B85">方向 ＋ 边界</text>

  <path d="M633 168 L633 246" stroke="#4A6DD4" stroke-width="1.8" marker-end="url(#alz-b)"/>
  <text x="645" y="212" font-size="11.5" fill="#8A93AD">写成报告</text>

  <path d="M498 308 L302 308" stroke="#4A6DD4" stroke-width="1.8" marker-end="url(#alz-b)"/>
  <text x="400" y="298" text-anchor="middle" font-size="11.5" fill="#8A93AD">同一份文本，换一个读者</text>

  <path d="M167 246 L167 170" stroke="#D4704A" stroke-width="1.8" marker-end="url(#alz-o)"/>
  <text x="155" y="212" text-anchor="end" font-size="11.5" fill="#9A8B85">两份意见</text>

  <text x="400" y="200" text-anchor="middle" font-size="12.5" fill="#9A9A9A">agent 生产</text>
  <text x="400" y="222" text-anchor="middle" font-size="12.5" fill="#9A9A9A">我评估</text>

  <rect x="38" y="384" width="724" height="34" rx="8" fill="#F3F0EA" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="58" y="406" font-size="12.5" fill="#6B6B6B">这个闭环唯一不决定的，是哪个问题值得问。那件事留在环外。</text>
</svg>
