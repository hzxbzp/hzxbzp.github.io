<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">When the answer gets cheap, where does the value go?</text>

  <!-- Left: getting cheaper -->
  <rect x="30" y="52" width="355" height="222" rx="10" fill="#FFF3F0" stroke="#D4704A" stroke-width="1.5"/>
  <text x="207" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#D4704A">Getting cheaper — the answer</text>

  <rect x="50" y="94" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="66" y="114" font-size="12" fill="#555">A fluent draft, on demand</text>

  <rect x="50" y="130" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="66" y="150" font-size="12" fill="#555">Boilerplate code that compiles</text>

  <rect x="50" y="166" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="66" y="186" font-size="12" fill="#555">A tidy summary of a long report</text>

  <rect x="50" y="202" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="66" y="222" font-size="12" fill="#555">A plan that sounds reasonable</text>

  <text x="207" y="256" text-anchor="middle" font-size="11" fill="#9A8B85">Seconds of compute. Almost free.</text>

  <!-- Right: getting scarcer -->
  <rect x="415" y="52" width="355" height="222" rx="10" fill="#F0F4FF" stroke="#4A6DD4" stroke-width="1.5"/>
  <text x="592" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#4A6DD4">Getting scarcer — the question</text>

  <rect x="435" y="94" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="451" y="114" font-size="12" fill="#555">Noticing what actually hurts</text>

  <rect x="435" y="130" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="451" y="150" font-size="12" fill="#555">Framing it so it can be solved</text>

  <rect x="435" y="166" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="451" y="186" font-size="12" fill="#555">Translating between two worlds</text>

  <rect x="435" y="202" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="451" y="222" font-size="12" fill="#555">Getting it to actually run, on site</text>

  <text x="592" y="256" text-anchor="middle" font-size="11" fill="#8A93AD">Only found where the work happens.</text>

  <!-- Bottom band -->
  <rect x="30" y="292" width="740" height="64" rx="10" fill="#F3F0EA" stroke="#E8E4DE" stroke-width="1.5"/>

  <text x="58" y="318" font-size="13" font-weight="600" fill="#9A9A9A">Invention</text>
  <path d="M128 313 L196 313" stroke="#D4704A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D4704A"/>
    </marker>
  </defs>
  <text x="208" y="318" font-size="13" font-weight="600" fill="#D4704A">Deployment</text>
  <text x="310" y="318" font-size="12" fill="#6B6B6B">— the narrow window, then the long one</text>

  <text x="58" y="340" font-size="11" fill="#9A9A9A">Electric light: 1879 · under 5% of factory drive by 1900 · the productivity payoff arrived in the 1920s</text>
</svg>
