<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-label="A four-step loop: I set the question and scope, the agent executes, it reports back in a fixed format, a second model reviews that report, and I read both and decide the next step" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="al-o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D4704A"/>
    </marker>
    <marker id="al-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A6DD4"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">One round of the loop</text>

  <!-- Me -->
  <rect x="38" y="52" width="258" height="112" rx="10" fill="#FFF3F0" stroke="#D4704A" stroke-width="1.5"/>
  <text x="58" y="78" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#D4704A">ME</text>
  <text x="58" y="102" font-size="12" fill="#555">Sets the question, the scope and</text>
  <text x="58" y="121" font-size="12" fill="#555">the metric. Reads both reviews,</text>
  <text x="58" y="140" font-size="12" fill="#555">then sends one reply back.</text>

  <!-- Agent -->
  <rect x="504" y="52" width="258" height="112" rx="10" fill="#F0F4FF" stroke="#4A6DD4" stroke-width="1.5"/>
  <text x="524" y="78" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#4A6DD4">CODING AGENT</text>
  <text x="524" y="102" font-size="12" fill="#555">Executes inside the agreed scope.</text>
  <text x="524" y="121" font-size="12" fill="#555">Asks first before touching design,</text>
  <text x="524" y="140" font-size="12" fill="#555">metric, data or direction.</text>

  <!-- Report -->
  <rect x="504" y="252" width="258" height="112" rx="10" fill="#FFFFFF" stroke="#C9C2B8" stroke-width="1.5"/>
  <text x="524" y="278" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#8A8178">THE REPORT</text>
  <text x="524" y="302" font-size="12" fill="#555">Six fixed slots: the ask · what was</text>
  <text x="524" y="321" font-size="12" fill="#555">done · results · conclusion ·</text>
  <text x="524" y="340" font-size="12" fill="#555">options · recommended next step</text>

  <!-- Second model -->
  <rect x="38" y="252" width="258" height="112" rx="10" fill="#F0F4FF" stroke="#4A6DD4" stroke-width="1.5"/>
  <text x="58" y="278" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#4A6DD4">SECOND MODEL</text>
  <text x="58" y="302" font-size="12" fill="#555">Reads the same report cold, with</text>
  <text x="58" y="321" font-size="12" fill="#555">no stake in the last six hours of</text>
  <text x="58" y="340" font-size="12" fill="#555">work, so the gaps show up.</text>

  <!-- arrows -->
  <path d="M300 108 L498 108" stroke="#D4704A" stroke-width="1.8" marker-end="url(#al-o)"/>
  <text x="399" y="98" text-anchor="middle" font-size="11" fill="#9A8B85">direction + scope</text>

  <path d="M633 168 L633 246" stroke="#4A6DD4" stroke-width="1.8" marker-end="url(#al-b)"/>
  <text x="645" y="212" font-size="11" fill="#8A93AD">writes it up</text>

  <path d="M498 308 L302 308" stroke="#4A6DD4" stroke-width="1.8" marker-end="url(#al-b)"/>
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#8A93AD">same text, second reader</text>

  <path d="M167 246 L167 170" stroke="#D4704A" stroke-width="1.8" marker-end="url(#al-o)"/>
  <text x="155" y="212" text-anchor="end" font-size="11" fill="#9A8B85">two reviews</text>

  <!-- centre note -->
  <text x="400" y="200" text-anchor="middle" font-size="12" font-style="italic" fill="#9A9A9A">the agent produces</text>
  <text x="400" y="220" text-anchor="middle" font-size="12" font-style="italic" fill="#9A9A9A">I evaluate</text>

  <!-- bottom band -->
  <rect x="38" y="384" width="724" height="34" rx="8" fill="#F3F0EA" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="58" y="406" font-size="12" fill="#6B6B6B">The loop doesn't decide which question is worth asking. That part is still on me.</text>
</svg>
