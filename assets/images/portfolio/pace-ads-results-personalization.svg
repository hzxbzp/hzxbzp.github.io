<svg viewBox="0 0 1000 370" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" role="img" aria-label="Across five occupant states the car cruises slower, stops further from pedestrians and waits for larger gaps as the rider becomes more anxious">
