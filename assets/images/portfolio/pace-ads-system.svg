<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" role="img" aria-label="Three agents sit beside the car's own software: a driver agent reads the road, a psychologist agent reads the rider's signals and words, and a coordinator turns both into a driving behaviour handed back to the planner">
  <rect width="1000" height="440" fill="#FCFCFB"/>
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA3B0"/></marker>
    <marker id="sb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BE4F28"/></marker>
  </defs>

  <text x="14" y="24" font-size="14" font-weight="600" fill="#2D2D2D">Three agents, working beside the car's own software</text>

  <!-- host stack -->
  <rect x="14" y="40" width="972" height="96" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="34" y="62" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#6E7A88">THE CAR'S OWN SOFTWARE — UNCHANGED</text>
  <rect x="34" y="76" width="170" height="42" rx="8" fill="#EEF1F5"/><text x="119" y="102" font-size="12" fill="#2D2D2D" text-anchor="middle">Perception</text>
  <path d="M210 97 L232 97" stroke="#9AA3B0" stroke-width="1.5" marker-end="url(#sa)"/>
  <rect x="238" y="76" width="170" height="42" rx="8" fill="#EEF1F5"/><text x="323" y="102" font-size="12" fill="#2D2D2D" text-anchor="middle">Route planning</text>
  <path d="M414 97 L436 97" stroke="#9AA3B0" stroke-width="1.5" marker-end="url(#sa)"/>
  <rect x="442" y="76" width="170" height="42" rx="8" fill="#EEF1F5"/><text x="527" y="102" font-size="12" fill="#2D2D2D" text-anchor="middle">Motion planning</text>
  <path d="M618 97 L640 97" stroke="#9AA3B0" stroke-width="1.5" marker-end="url(#sa)"/>
  <rect x="646" y="76" width="150" height="42" rx="8" fill="#EEF1F5"/><text x="721" y="102" font-size="12" fill="#2D2D2D" text-anchor="middle">Control</text>
  <path d="M802 97 L824 97" stroke="#9AA3B0" stroke-width="1.5" marker-end="url(#sa)"/>
  <rect x="830" y="78" width="136" height="38" rx="8" fill="#FFFFFF" stroke="#C9C2B8" stroke-width="1.5"/><text x="898" y="102" font-size="12" fill="#6B6B6B" text-anchor="middle">the car</text>

  <!-- wiring -->
  <path d="M119 138 L119 152 L330 152 L330 174" stroke="#9AA3B0" stroke-width="1.5" fill="none" marker-end="url(#sa)"/>
  <text x="136" y="148" font-size="10.5" fill="#9A9A9A">camera views + objects, speeds, lanes</text>
  <path d="M764 180 L764 176 L527 176 L527 140" stroke="#BE4F28" stroke-width="1.8" fill="none" marker-end="url(#sb)"/>
  <text x="556" y="170" font-size="10.5" font-weight="600" fill="#BE4F28">a driving behaviour + its settings</text>

  <!-- rider -->
  <rect x="14" y="288" width="168" height="86" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="32" y="310" font-size="11" font-weight="600" fill="#6E7A88">THE RIDER</text>
  <text x="32" y="331" font-size="11" fill="#2D2D2D">face · heart rate · EEG</text>
  <text x="32" y="350" font-size="11" font-style="italic" fill="#BE4F28">“Exit at the next turn.”</text>
  <path d="M186 331 L206 331" stroke="#BE4F28" stroke-width="1.5" marker-end="url(#sb)"/>

  <!-- PACE-ADS -->
  <rect x="196" y="180" width="790" height="212" rx="10" fill="#FDF4EF" stroke="#BE4F28" stroke-width="1.5"/>
  <text x="214" y="202" font-size="13" font-weight="700" fill="#BE4F28">PACE-ADS</text>
  <text x="300" y="202" font-size="10.5" fill="#9A7A6B">three language-model agents · no training · wakes only when something changes</text>

  <rect x="214" y="214" width="312" height="78" rx="8" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="230" y="236" font-size="11.5" font-weight="600" fill="#BE4F28">Driver agent — reads the road</text>
  <text x="230" y="256" font-size="11" fill="#2D2D2D">Weather, signals, work zones, who is</text>
  <text x="230" y="272" font-size="11" fill="#2D2D2D">around and what they seem about to do.</text>

  <rect x="214" y="302" width="312" height="78" rx="8" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="230" y="324" font-size="11.5" font-weight="600" fill="#BE4F28">Psychologist — reads the rider</text>
  <text x="230" y="344" font-size="11" fill="#2D2D2D">Calm, anxious or in a hurry — and what</text>
  <text x="230" y="360" font-size="11" fill="#2D2D2D">they just said, in plain words.</text>

  <path d="M530 253 L554 253" stroke="#BE4F28" stroke-width="1.5" marker-end="url(#sb)"/>
  <path d="M530 341 L554 341" stroke="#BE4F28" stroke-width="1.5" marker-end="url(#sb)"/>

  <rect x="560" y="214" width="408" height="166" rx="8" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <text x="578" y="236" font-size="11.5" font-weight="600" fill="#BE4F28">Coordinator — decides</text>
  <text x="578" y="258" font-size="11" fill="#2D2D2D">Safety first, then the rider's preference. It picks one of the</text>
  <text x="578" y="274" font-size="11" fill="#2D2D2D">moves the car already knows — follow, keep lane, change</text>
  <text x="578" y="290" font-size="11" fill="#2D2D2D">lane, stop — and sets how briskly to do it.</text>
  <text x="578" y="314" font-size="11" fill="#2D2D2D">Every setting stays inside a fixed safe range, so a hurried</text>
  <text x="578" y="330" font-size="11" fill="#2D2D2D">rider never buys speed with safety.</text>
  <text x="578" y="354" font-size="11" fill="#2D2D2D">When it is not sure, it explains the hold-up and asks.</text>

  <text x="14" y="414" font-size="11" fill="#6B6B6B">Real-time control stays with the car. PACE-ADS works at the slow, high-level layer and wakes only when the rider's state changes, the rider says</text>
  <text x="14" y="430" font-size="11" fill="#6B6B6B">something, or the car gets stuck — so the rest of the drive is untouched.</text>
</svg>
