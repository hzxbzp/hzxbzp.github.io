<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" role="img" aria-label="A speed trace: the car drops to a standstill, StuckSolver steps in, and the car returns to speed">
  <rect width="800" height="450" fill="#FAF7F4"/>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BE4F28" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#BE4F28" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- baseline -->
  <line x1="70" y1="330" x2="740" y2="330" stroke="#E2DAD3" stroke-width="2"/>

  <!-- area + curve: fast, stop, wait, recover -->
  <path d="M70 150 L210 150 C250 150 262 330 300 330 L470 330 C508 330 520 150 560 150 L740 150 L740 330 L70 330 Z" fill="url(#fade)"/>
  <path d="M70 150 L210 150 C250 150 262 330 300 330 L470 330 C508 330 520 150 560 150 L740 150"
        fill="none" stroke="#BE4F28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stop marker -->
  <circle cx="385" cy="330" r="9" fill="#FAF7F4" stroke="#BE4F28" stroke-width="3"/>
  <line x1="385" y1="330" x2="385" y2="250" stroke="#BE4F28" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="385" y="238" font-size="15" font-weight="700" fill="#BE4F28" text-anchor="middle">StuckSolver steps in</text>

  <text x="140" y="134" font-size="13" fill="#8A8178">driving</text>
  <text x="385" y="362" font-size="13" fill="#8A8178" text-anchor="middle">stopped by a plastic bag</text>
  <text x="650" y="134" font-size="13" fill="#8A8178" text-anchor="middle">moving again</text>

  <text x="70" y="64" font-size="30" font-weight="700" fill="#2D2D2D">StuckSolver</text>
  <text x="70" y="96" font-size="16" fill="#6B6B6B">Getting a stuck self-driving car moving again — on its own,</text>
  <text x="70" y="118" font-size="16" fill="#6B6B6B">or on a sentence from the passenger.</text>

  <text x="70" y="410" font-size="13" fill="#9A9A9A">IEEE Intelligent Vehicles Symposium 2026 · closed-loop CARLA evaluation</text>
</svg>
