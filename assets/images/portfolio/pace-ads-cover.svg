<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" role="img" aria-label="Two speed traces through the same red light: a hurried rider gets late firm braking and a brisk restart, an anxious rider gets early gentle braking and a slow restart">
  <rect width="800" height="450" fill="#FAF7F4"/>

  <text x="70" y="64" font-size="30" font-weight="700" fill="#2D2D2D">PACE-ADS</text>
  <text x="70" y="96" font-size="16" fill="#6B6B6B">A self-driving car that reads the road — and the person inside it.</text>

  <!-- axis -->
  <line x1="70" y1="372" x2="730" y2="372" stroke="#E2DAD3" stroke-width="2"/>
  <text x="70" y="394" font-size="12" fill="#A39B92">approaching a red light</text>
  <text x="730" y="394" font-size="12" fill="#A39B92" text-anchor="end">pulling away</text>

  <!-- the light -->
  <line x1="400" y1="150" x2="400" y2="372" stroke="#C9C2B8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="400" cy="140" r="7" fill="#BE4F28"/>

  <!-- impatient -->
  <path d="M70 186 L300 186 C352 186 362 372 400 372 L430 372 C470 372 476 196 520 196 L730 196"
        fill="none" stroke="#BE4F28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="174" font-size="13" font-weight="600" fill="#BE4F28">in a hurry</text>
  <text x="730" y="184" font-size="13" font-weight="600" fill="#BE4F28" text-anchor="end">brisk restart</text>

  <!-- anxious -->
  <path d="M70 286 L190 286 C280 286 300 372 400 372 L430 372 C520 372 540 318 620 318 L730 318"
        fill="none" stroke="#33578A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="274" font-size="13" font-weight="600" fill="#33578A">feeling anxious</text>
  <text x="730" y="306" font-size="13" font-weight="600" fill="#33578A" text-anchor="end">gentle restart</text>

  <text x="70" y="428" font-size="13" fill="#9A9A9A">Same junction, same rules — a different ride. Journal of Intelligent and Connected Vehicles, 2026.</text>
</svg>
