<svg viewBox="0 0 880 486" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,sans-serif" role="img" aria-label="SmallGoal 架构：账单 CSV 和 Plaid 自动同步进入本机的处理流程，经过保存原始记录、换算成分、去重、按规则分类、配对转账、拿不准时提问六步，写进 SQLite，再由 FastAPI 提供给电脑浏览器和手机" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
