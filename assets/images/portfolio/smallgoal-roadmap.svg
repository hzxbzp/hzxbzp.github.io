<svg viewBox="0 0 900 384" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,sans-serif" role="img" aria-label="Planned: each paycheck is split by your rules into virtual accounts for savings, travel, growth and daily spending; later a read-only agent analyses the ledger and only proposes changes, which apply after you confirm" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
