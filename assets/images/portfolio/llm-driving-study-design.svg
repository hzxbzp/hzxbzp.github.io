<svg viewBox="0 0 800 410" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8A99A"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">How we probed each model</text>

  <!-- 1. A driving situation -->
  <rect x="20" y="50" width="230" height="220" rx="10" fill="#FFF3F0" stroke="#D4704A" stroke-width="1.5"/>
  <text x="135" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#D4704A">1 · A driving situation</text>
  <rect x="35" y="94" width="200" height="126" rx="8" fill="#FFFFFF" stroke="#EAD7CF" stroke-width="1"/>
  <circle cx="52" cy="114" r="3" fill="#D4704A"/>
  <text x="62" y="118" font-size="12" font-weight="600" fill="#2D2D2D">Merging onto a freeway</text>
  <circle cx="52" cy="140" r="3" fill="#D4704A"/>
  <text x="62" y="144" font-size="12" fill="#555555">Rainy night, wet road</text>
  <circle cx="52" cy="166" r="3" fill="#D4704A"/>
  <text x="62" y="170" font-size="12" fill="#555555">Ambulance right behind</text>
  <circle cx="52" cy="192" r="3" fill="#D4704A"/>
  <text x="62" y="196" font-size="12" fill="#555555">Urgent trip to hospital</text>
  <text x="135" y="250" text-anchor="middle" font-size="11" fill="#9A8B85">1,500 random situations per scenario</text>

  <line x1="254" y1="160" x2="279" y2="160" stroke="#B8A99A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Three languages, three models -->
  <rect x="285" y="50" width="230" height="220" rx="10" fill="#F0F4FF" stroke="#4A6DD4" stroke-width="1.5"/>
  <text x="400" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#4A6DD4">2 · Asked in 3 languages</text>
  <rect x="296" y="94" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="328" y="111" text-anchor="middle" font-size="12" fill="#4A6DD4">English</text>
  <rect x="368" y="94" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="400" y="111" text-anchor="middle" font-size="12" fill="#4A6DD4">中文</text>
  <rect x="440" y="94" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="472" y="111" text-anchor="middle" font-size="12" fill="#4A6DD4">Français</text>
  <text x="400" y="142" text-anchor="middle" font-size="11" fill="#8A93AD">to each of</text>
  <rect x="300" y="150" width="200" height="22" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="500" fill="#2D2D2D">GPT-4o</text>
  <rect x="300" y="176" width="200" height="22" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="400" y="191" text-anchor="middle" font-size="12" font-weight="500" fill="#2D2D2D">DeepSeek-V3</text>
  <rect x="300" y="202" width="200" height="22" rx="6" fill="#FFFFFF" stroke="#D6DEF5" stroke-width="1"/>
  <text x="400" y="217" text-anchor="middle" font-size="12" font-weight="500" fill="#2D2D2D">Llama 3.1-405B</text>
  <text x="400" y="250" text-anchor="middle" font-size="11" fill="#8A93AD">3 models × 3 languages</text>

  <line x1="519" y1="160" x2="544" y2="160" stroke="#B8A99A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Pick a move, say why -->
  <rect x="550" y="50" width="230" height="220" rx="10" fill="#FBF6EC" stroke="#D9A441" stroke-width="1.5"/>
  <text x="665" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#B7832A">3 · Pick a move, say why</text>
  <rect x="565" y="94" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#EFE2C6" stroke-width="1"/>
  <circle cx="582" cy="107" r="5" fill="#D4704A"/>
  <text x="594" y="111" font-size="12" fill="#2D2D2D">Assertive merge</text>
  <rect x="565" y="126" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#EFE2C6" stroke-width="1"/>
  <circle cx="582" cy="139" r="5" fill="#D9A441"/>
  <text x="594" y="143" font-size="12" fill="#2D2D2D">Cooperative merge</text>
  <rect x="565" y="158" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#EFE2C6" stroke-width="1"/>
  <circle cx="582" cy="171" r="5" fill="#4A6DD4"/>
  <text x="594" y="175" font-size="12" fill="#2D2D2D">Cautious merge</text>
  <rect x="565" y="194" width="200" height="26" rx="6" fill="none" stroke="#D9A441" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="665" y="211" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B6B6B">+ a one-sentence reason</text>
  <text x="665" y="250" text-anchor="middle" font-size="11" fill="#9A8B85">Options ranked assertive → cautious</text>

  <text x="400" y="289" text-anchor="middle" font-size="12" fill="#9A9A9A">× 4 scenarios  ·  54,000 decisions in total</text>

  <!-- Two lenses -->
  <rect x="20" y="302" width="365" height="94" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="40" y="330" font-size="13.5" font-weight="600" fill="#2D2D2D">What moves the choice?</text>
  <text x="40" y="354" font-size="12" fill="#6B6B6B">An ordered logit model shows which factors push</text>
  <text x="40" y="373" font-size="12" fill="#6B6B6B">a model toward caution or toward assertiveness.</text>

  <rect x="415" y="302" width="365" height="94" rx="10" fill="#FFFFFF" stroke="#E8E4DE" stroke-width="1.5"/>
  <text x="435" y="330" font-size="13.5" font-weight="600" fill="#2D2D2D">What are the reasons about?</text>
  <text x="435" y="354" font-size="12" fill="#6B6B6B">Reading the explanations shows what each model</text>
  <text x="435" y="373" font-size="12" fill="#6B6B6B">attends to: safety, traffic, weather, urgency.</text>
</svg>
