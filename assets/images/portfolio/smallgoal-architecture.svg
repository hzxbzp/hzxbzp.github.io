<rect x="486" y="70" width="202" height="62" rx="10" fill="#F0F4FF" stroke="#CFDAF4" stroke-width="1.5"/>
<text x="502" y="98.0" font-size="13.5" font-weight="600" fill="#3F63C9">SQLite</text>
<text x="502" y="116.0" font-size="12" fill="#5F5F5F">one file · daily backup</text>
<rect x="486" y="170" width="202" height="62" rx="10" fill="#F0F4FF" stroke="#CFDAF4" stroke-width="1.5"/>
<text x="502" y="198.0" font-size="13.5" font-weight="600" fill="#3F63C9">FastAPI</text>
<text x="502" y="216.0" font-size="12" fill="#5F5F5F">REST API for UI and agents</text>
<rect x="486" y="270" width="202" height="62" rx="10" fill="#F0F4FF" stroke="#CFDAF4" stroke-width="1.5"/>
<text x="502" y="298.0" font-size="13.5" font-weight="600" fill="#3F63C9">Web interface</text>
<text x="502" y="316.0" font-size="12" fill="#5F5F5F">React · hand-drawn SVG charts</text>
<path d="M456 178 C470.0 178 470.0 101 484 101" stroke="#C9622F" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
