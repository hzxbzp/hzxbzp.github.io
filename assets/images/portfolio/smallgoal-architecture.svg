<svg viewBox="0 0 880 486" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,sans-serif" role="img" aria-label="SmallGoal architecture: bank CSVs and Plaid sync feed a six-step pipeline on your own computer (keep raw copy, convert to cents, remove duplicates, categorize by rules, pair transfers, ask when unsure), stored in SQLite and served by FastAPI to a desktop browser and an iPhone" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9B2A8"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9622F"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F63C9"/></marker>
</defs>
<rect width="880" height="486" fill="#FCFBF9"/>
<rect x="236" y="14" width="472" height="458" rx="16" fill="#F7F4EF" stroke="#D9D1C5" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="256" y="40" font-size="12.5" font-weight="600" fill="#9A9A9A" letter-spacing="0.03em">On your own computer</text>
