<text x="30" y="113.0" font-size="13" font-weight="600" fill="#2D2D2D">Bank &amp; card CSVs</text>
<text x="30" y="131.0" font-size="12" fill="#5F5F5F">Chase · Amex · Citi · BofA …</text>
<rect x="14" y="166" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="1.5"/>
<text x="30" y="193.0" font-size="13" font-weight="600" fill="#2D2D2D">Plaid auto-sync</text>
<text x="30" y="211.0" font-size="12" fill="#5F5F5F">read-only, every 3 hours</text>
<rect x="14" y="246" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="30" y="273.0" font-size="13" font-weight="600" fill="#2D2D2D">Alipay · WeChat · CN banks</text>
<text x="30" y="291.0" font-size="12" fill="#5F5F5F">interface ready</text>
<rect x="256" y="58" width="200" height="296" rx="12" fill="#FDF3EE" stroke="#EAC9B6" stroke-width="1.5"/>
<text x="272" y="84" font-size="13.5" font-weight="700" fill="#C9622F">Pipeline</text>
<circle cx="283" cy="120" r="10" fill="#FFFFFF" stroke="#C9622F" stroke-width="1.3"/>
<text x="283" y="124.5" font-size="11.5" font-weight="700" fill="#C9622F" text-anchor="middle">1</text>
<text x="302" y="125" font-size="13" fill="#2D2D2D">Keep a raw copy</text>
<circle cx="283" cy="160" r="10" fill="#FFFFFF" stroke="#C9622F" stroke-width="1.3"/>
<text x="283" y="164.5" font-size="11.5" font-weight="700" fill="#C9622F" text-anchor="middle">2</text>
<text x="302" y="165" font-size="13" fill="#2D2D2D">Convert to cents</text>
<circle cx="283" cy="200" r="10" fill="#FFFFFF" stroke="#C9622F" stroke-width="1.3"/>
<text x="283" y="204.5" font-size="11.5" font-weight="700" fill="#C9622F" text-anchor="middle">3</text>
<text x="302" y="205" font-size="13" fill="#2D2D2D">Remove duplicates</text>
<circle cx="283" cy="240" r="10" fill="#FFFFFF" stroke="#C9622F" stroke-width="1.3"/>
<text x="283" y="244.5" font-size="11.5" font-weight="700" fill="#C9622F" text-anchor="middle">4</text>
<text x="302" y="245" font-size="13" fill="#2D2D2D">Categorize by rules</text>
<circle cx="283" cy="280" r="10" fill="#FFFFFF" stroke="#C9622F" stroke-width="1.3"/>
<text x="283" y="284.5" font-size="11.5" font-weight="700" fill="#C9622F" text-anchor="middle">5</text>
<text x="302" y="285" font-size="13" fill="#2D2D2D">Pair transfers</text>
<circle cx="283" cy="320" r="10" fill="#FFFFFF" stroke="#C9622F" stroke-width="1.3"/>
<text x="283" y="324.5" font-size="11.5" font-weight="700" fill="#C9622F" text-anchor="middle">6</text>
<text x="302" y="325" font-size="13" fill="#2D2D2D">Ask when unsure</text>
