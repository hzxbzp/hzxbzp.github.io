<text x="746" y="266.0" font-size="13" font-weight="600" fill="#2D2D2D">Desktop browser</text>
<rect x="730" y="316" width="138" height="50" rx="10" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="1.5"/>
<text x="746" y="346.0" font-size="13" font-weight="600" fill="#2D2D2D">iPhone (PWA)</text>
<path d="M688 301 C708.0 301 708.0 261 728 261" stroke="#3F63C9" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
<path d="M688 301 C708.0 301 708.0 341 728 341" stroke="#3F63C9" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
<text x="799" y="390" font-size="12" fill="#5F5F5F" text-anchor="middle">via Tailscale</text>
