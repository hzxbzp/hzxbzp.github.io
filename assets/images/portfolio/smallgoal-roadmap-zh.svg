<svg viewBox="0 0 900 384" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,sans-serif" role="img" aria-label="计划中的功能：工资进来后按规则自动分到储蓄、旅游、成长、日常开销四个虚拟账户；之后接入只读的 Agent 做财务分析，它只提建议，由你确认后才生效" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9B2A8"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9622F"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F63C9"/></marker>
</defs>
<rect width="900" height="384" fill="#FCFBF9"/>
<rect x="14" y="96" width="168" height="64" rx="10" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="1.5"/>
<text x="30" y="125.0" font-size="13.5" font-weight="600" fill="#2D2D2D">工资到账</text>
<text x="30" y="143.0" font-size="12" fill="#5F5F5F">或任何一笔收入</text>
<rect x="222" y="96" width="186" height="64" rx="10" fill="#FDF3EE" stroke="#EAC9B6" stroke-width="1.5"/>
<text x="238" y="125.0" font-size="13.5" font-weight="600" fill="#C9622F">你定的分配规则</text>
<text x="238" y="143.0" font-size="12" fill="#5F5F5F">按比例或固定金额</text>
<path d="M182 128 L220 128" stroke="#C9622F" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
<rect x="470" y="22" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#EAC9B6" stroke-width="1.5"/>
<rect x="470" y="22" width="6" height="52" rx="3" fill="#C9622F"/>
<text x="490" y="44" font-size="13.5" font-weight="600" fill="#2D2D2D">储蓄</text>
<text x="490" y="62" font-size="12" fill="#5F5F5F">应急金、长期目标</text>
<path d="M408 128 C438.0 128 438.0 48 468 48" stroke="#C9622F" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
<rect x="470" y="84" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#EAC9B6" stroke-width="1.5"/>
<rect x="470" y="84" width="6" height="52" rx="3" fill="#C9622F"/>
<text x="490" y="106" font-size="13.5" font-weight="600" fill="#2D2D2D">旅游</text>
<text x="490" y="124" font-size="12" fill="#5F5F5F">下一次出发</text>
<path d="M408 128 C438.0 128 438.0 110 468 110" stroke="#C9622F" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
<rect x="470" y="146" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#EAC9B6" stroke-width="1.5"/>
<rect x="470" y="146" width="6" height="52" rx="3" fill="#C9622F"/>
<text x="490" y="168" font-size="13.5" font-weight="600" fill="#2D2D2D">成长</text>
<text x="490" y="186" font-size="12" fill="#5F5F5F">课程、书、工具</text>
<path d="M408 128 C438.0 128 438.0 172 468 172" stroke="#C9622F" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
<rect x="470" y="208" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#EAC9B6" stroke-width="1.5"/>
<rect x="470" y="208" width="6" height="52" rx="3" fill="#C9622F"/>
<text x="490" y="230" font-size="13.5" font-weight="600" fill="#2D2D2D">日常开销</text>
<text x="490" y="248" font-size="12" fill="#5F5F5F">吃饭、房租、交通</text>
<path d="M408 128 C438.0 128 438.0 234 468 234" stroke="#C9622F" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
<path d="M585 262 L585 280 L164 280 L164 296" stroke="#3F63C9" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<rect x="14" y="300" width="300" height="66" rx="10" fill="#F0F4FF" stroke="#CFDAF4" stroke-width="1.5"/>
<text x="30" y="330.0" font-size="13.5" font-weight="600" fill="#3F63C9">Agent（只读）</text>
<text x="30" y="348.0" font-size="12" fill="#5F5F5F">月度总结、问答、发现异常</text>
<rect x="354" y="300" width="230" height="66" rx="10" fill="#FFFFFF" stroke="#CFDAF4" stroke-width="1.5"/>
<text x="370" y="330.0" font-size="13.5" font-weight="600" fill="#3F63C9">提建议</text>
<text x="370" y="348.0" font-size="12" fill="#5F5F5F">新规则、调整分配</text>
<rect x="624" y="300" width="262" height="66" rx="10" fill="#FFFFFF" stroke="#E2DCD3" stroke-width="1.5"/>
<text x="640" y="330.0" font-size="13.5" font-weight="600" fill="#2D2D2D">你确认</text>
<text x="640" y="348.0" font-size="12" fill="#5F5F5F">校验通过后才写进账本</text>
<path d="M314 333 L352 333" stroke="#3F63C9" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
<path d="M584 333 L622 333" stroke="#B9B2A8" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
</svg>