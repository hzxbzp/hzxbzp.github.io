<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A6DD4"/>
      <stop offset="0.5" stop-color="#D9C3A5"/>
      <stop offset="1" stop-color="#D4704A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="400" fill="#F3F0EA"/>

  <!-- Lane marking -->
  <line x1="0" y1="376" x2="900" y2="376" stroke="#E3DCD1" stroke-width="4" stroke-dasharray="36 22"/>

  <text x="450" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#2D2D2D" letter-spacing="-0.5">Same road. Different drivers.</text>
  <text x="450" y="94" text-anchor="middle" font-size="14" fill="#6B6B6B">How three LLMs choose between cautious and assertive driving</text>

  <!-- GPT-4o: leans cautious -->
  <path d="M 80 285 A 110 110 0 0 1 300 285" fill="none" stroke="url(#dial)" stroke-width="16" stroke-linecap="round"/>
  <line x1="190" y1="285" x2="133.9" y2="217.2" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="190" cy="285" r="9" fill="#2D2D2D"/>
  <circle cx="190" cy="285" r="3.5" fill="#F3F0EA"/>
  <text x="80" y="314" text-anchor="middle" font-size="11" fill="#9A9A9A">cautious</text>
  <text x="300" y="314" text-anchor="middle" font-size="11" fill="#9A9A9A">assertive</text>
  <text x="190" y="344" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">GPT-4o</text>

  <!-- DeepSeek-V3: leans assertive -->
  <path d="M 340 285 A 110 110 0 0 1 560 285" fill="none" stroke="url(#dial)" stroke-width="16" stroke-linecap="round"/>
  <line x1="450" y1="285" x2="501.7" y2="213.8" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="450" cy="285" r="9" fill="#2D2D2D"/>
  <circle cx="450" cy="285" r="3.5" fill="#F3F0EA"/>
  <text x="340" y="314" text-anchor="middle" font-size="11" fill="#9A9A9A">cautious</text>
  <text x="560" y="314" text-anchor="middle" font-size="11" fill="#9A9A9A">assertive</text>
  <text x="450" y="344" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">DeepSeek-V3</text>

  <!-- Llama 3.1: leans assertive -->
  <path d="M 600 285 A 110 110 0 0 1 820 285" fill="none" stroke="url(#dial)" stroke-width="16" stroke-linecap="round"/>
  <line x1="710" y1="285" x2="761.7" y2="213.8" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="710" cy="285" r="9" fill="#2D2D2D"/>
  <circle cx="710" cy="285" r="3.5" fill="#F3F0EA"/>
  <text x="600" y="314" text-anchor="middle" font-size="11" fill="#9A9A9A">cautious</text>
  <text x="820" y="314" text-anchor="middle" font-size="11" fill="#9A9A9A">assertive</text>
  <text x="710" y="344" text-anchor="middle" font-size="17" font-weight="600" fill="#2D2D2D">Llama 3.1</text>
</svg>
