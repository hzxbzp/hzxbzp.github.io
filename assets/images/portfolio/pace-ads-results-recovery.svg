<svg viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif" role="img" aria-label="The baseline agent recovers in none of 90 runs; StuckSolver recovers in 83.3 percent and PACE-ADS in 91.1 percent, with gains on the roundabout and road closure scenarios and a drop on static obstacles caused by refusals">
