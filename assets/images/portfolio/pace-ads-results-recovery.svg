  <text x="40" y="324" font-size="10" fill="#9A9A9A">The baseline never recovers: these three scenarios lie outside what a conventional stack resolves.</text>
  <text x="40" y="340" font-size="10" fill="#9A9A9A">On static obstacles PACE-ADS scores lower because it sometimes refuses the rider's instruction after checking it against the scene — a refusal, not a failure.</text>
