  <text x="289.0" y="276.0" font-size="10" fill="#6B6B6B" text-anchor="middle">StuckSolver</text>
  <text x="289.0" y="288.0" font-size="10" fill="#6B6B6B" text-anchor="middle">(earlier work)</text>
  <rect x="411.7" y="94.2" width="36.0" height="165.8" rx="3.5" fill="#BE4F28"/>
  <text x="429.7" y="88.2" font-size="10.5" font-weight="600" fill="#2D2D2D" text-anchor="middle">91.1</text>
