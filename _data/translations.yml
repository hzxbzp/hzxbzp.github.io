  about:
    title: "关于我"
    lead: "一半脚踏实地，一半心向可能。"
    intro: "我喜欢做一些真正回应现实需要的东西，也希望它们能为生活留下些许温度、趣味与惊喜。于我而言，技术真正动人的地方，从来不只是让生活更高效，而是让生活因此变得更丰盈。"
    p2: "我们正身处一个被 AI 重新塑造的时代。变化来得很快，未来也并不清晰。比起被不确定性裹挟，我更愿意保持好奇，保有希望，也始终留意那些让生活值得热爱的事物。"
    p3: "这里记录我做过的东西、看到的世界，以及那些仍在慢慢想明白的问题——关于技术，关于未来，也关于如何更好地生活。"
    skills_title: "我在做什么"
    skills_subtitle: "专业方向与兴趣所在"
    skills:
      - icon: "fa-brain"
        title: "人工智能"
        desc: "深度学习、计算机视觉、自然语言处理，以及让机器读懂这个世界的种种尝试。"
      - icon: "fa-robot"
        title: "机器人"
        desc: "从感知到规划再到控制——构建能与物理世界打交道的智能系统。"
      - icon: "fa-car"
        title: "无人驾驶"
        desc: "探索出行的未来：多传感器融合、路径规划，以及安全与自主之间那支复杂的舞。"
    journey_title: "我的轨迹"
